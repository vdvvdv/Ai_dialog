name: Build APK
on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Save custom files
        run: |
          mkdir -p _backup
          cp lib/main.dart _backup/
          cp pubspec.yaml _backup/

      - name: Create Flutter project scaffolding
        run: flutter create --overwrite --project-name ai_dialog --org com.example .

      - name: Restore custom files
        run: |
          cp _backup/main.dart lib/main.dart
          cp _backup/pubspec.yaml pubspec.yaml

      - name: Sanitize dart sources (remove copy-paste escapes)
        run: sed -i 's/\\;/;/g; s/\\_/_/g' lib/main.dart

      - name: Add INTERNET permission to manifest
        run: |
          sed -i '/<manifest/a\    <uses-permission android:name="android.permission.INTERNET"/>' \
            android/app/src/main/AndroidManifest.xml

      - name: Auto-version from run number (1.0.N+N)
        run: |
          sed -i -E "s/^version: .*/version: 1.0.${{ github.run_number }}+${{ github.run_number }}/" pubspec.yaml
          grep '^version:' pubspec.yaml

      - name: flutter pub get
        run: flutter pub get

      - name: Analyze (non-blocking)
        run: flutter analyze --no-fatal-infos --no-fatal-warnings || true

      - name: Build arm64 APK (release)
        run: |
          flutter build apk --release --target-platform android-arm64 \
            --obfuscate --split-debug-info=./debug_info \
            --dart-define=APP_VERSION=1.0.${{ github.run_number }}

      - name: Sign APK with persistent keystore
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          KS_PASSWORD: ${{ secrets.KS_PASSWORD }}
        run: |
          set -e
          echo "$KEYSTORE_B64" | base64 -d > /tmp/upload.keystore
          BT=$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)
          # Снимаем подпись Flutter, чтобы apksigner подписал начисто
          cp build/app/outputs/flutter-apk/app-release.apk /tmp/unsigned.apk
          zip -d /tmp/unsigned.apk 'META-INF/*' || true
          "$ANDROID_HOME/build-tools/$BT/zipalign" -f -p 4 \
            /tmp/unsigned.apk /tmp/aligned.apk
          "$ANDROID_HOME/build-tools/$BT/apksigner" sign \
            --ks /tmp/upload.keystore \
            --ks-key-alias upload \
            --ks-pass pass:"$KS_PASSWORD" \
            --key-pass pass:"$KS_PASSWORD" \
            --out build/app/outputs/flutter-apk/app-release-signed.apk \
            /tmp/aligned.apk
          "$ANDROID_HOME/build-tools/$BT/apksigner" verify \
            build/app/outputs/flutter-apk/app-release-signed.apk
          rm -f /tmp/upload.keystore /tmp/unsigned.apk /tmp/aligned.apk

      - uses: actions/upload-artifact@v4
        with:
          name: release-apk-arm64
          path: build/app/outputs/flutter-apk/app-release-signed.apk
